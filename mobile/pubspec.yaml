name: dupefinder_mobile
description: DupeFinder Mobile Application - Find affordable luxury alternatives
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # HTTP & API
  http: ^1.1.2
  http_parser: ^4.0.0
  dio: ^5.4.0
  
  # Image Handling
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI Enhancements
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  
  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.2
  image_cropper: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/login_welcome.png
    - assets/splash_hero.png
  
  # Fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf

