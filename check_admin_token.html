<!DOCTYPE html>
<html>
<head>
    <title>Check Admin Token</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .info { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; padding: 10px; margin: 10px 0; border-radius: 5px; color: #c62828; }
        .success { background: #e8f5e9; padding: 10px; margin: 10px 0; border-radius: 5px; color: #2e7d32; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Admin Token Checker</h1>
    
    <div id="results"></div>
    
    <button onclick="checkToken()">Check Token</button>
    <button onclick="clearToken()">Clear Token & Redirect to Login</button>
    <button onclick="testLogin()">Test Admin Login</button>
    
    <script>
        function checkToken() {
            const results = document.getElementById('results');
            results.innerHTML = '';
            
            const adminToken = localStorage.getItem('adminToken');
            const adminData = localStorage.getItem('adminData');
            const regularToken = localStorage.getItem('token');
            
            let html = '<div class="info"><h3>Token Status:</h3>';
            
            if (adminToken) {
                html += `<p class="success">✅ Admin Token Found: ${adminToken.substring(0, 30)}...</p>`;
                html += `<p>Full Token: ${adminToken}</p>`;
            } else {
                html += `<p class="error">❌ No Admin Token Found</p>`;
            }
            
            if (adminData) {
                try {
                    const data = JSON.parse(adminData);
                    html += `<p class="success">✅ Admin Data Found:</p>`;
                    html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } catch(e) {
                    html += `<p class="error">❌ Admin Data Invalid: ${e.message}</p>`;
                }
            } else {
                html += `<p class="error">❌ No Admin Data Found</p>`;
            }
            
            if (regularToken) {
                html += `<p class="info">⚠️ Regular Token Also Found: ${regularToken.substring(0, 30)}...</p>`;
            }
            
            html += '</div>';
            
            // Test token
            if (adminToken) {
                html += '<div class="info"><h3>Testing Token:</h3>';
                fetch('http://localhost:8000/api/admin/scraping/brands?brand_type=local', {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                })
                .then(response => {
                    if (response.ok) {
                        html += '<p class="success">✅ Token is VALID! API call succeeded.</p>';
                    } else {
                        html += `<p class="error">❌ Token is INVALID! Status: ${response.status}</p>`;
                        return response.text().then(text => {
                            html += `<p>Error: ${text}</p>`;
                            results.innerHTML = html;
                        });
                    }
                    results.innerHTML = html;
                })
                .catch(error => {
                    html += `<p class="error">❌ Error testing token: ${error.message}</p>`;
                    results.innerHTML = html;
                });
            } else {
                results.innerHTML = html;
            }
        }
        
        function clearToken() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminData');
            localStorage.removeItem('token');
            alert('Tokens cleared! Redirecting to login...');
            window.location.href = '/';
        }
        
        async function testLogin() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing admin login...</p>';
            
            try {
                const response = await fetch('http://localhost:8000/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@dupefinder.com',
                        password: 'admin123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('adminToken', data.access_token);
                    localStorage.setItem('adminData', JSON.stringify(data.admin));
                    
                    results.innerHTML = `
                        <div class="success">
                            <h3>✅ Login Successful!</h3>
                            <p>Token stored: ${data.access_token.substring(0, 30)}...</p>
                            <p>Admin Email: ${data.admin.email}</p>
                            <p>Now refresh the admin dashboard page!</p>
                        </div>
                    `;
                } else {
                    const error = await response.text();
                    results.innerHTML = `
                        <div class="error">
                            <h3>❌ Login Failed!</h3>
                            <p>Status: ${response.status}</p>
                            <p>Error: ${error}</p>
                        </div>
                    `;
                }
            } catch (error) {
                results.innerHTML = `
                    <div class="error">
                        <h3>❌ Error!</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        // Auto-check on load
        window.onload = checkToken;
    </script>
</body>
</html>
