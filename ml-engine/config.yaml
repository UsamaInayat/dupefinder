# DupeFinder ML Engine Configuration

model:
  architecture: "fashionclip"         # patrickjohncyh/fashion-clip (CLIP ViT-B/32)
  id: "patrickjohncyh/fashion-clip"
  embedding_dimension: 512
  device: "auto"                      # auto: cuda > mps > cpu

preprocessing:
  target_size: [224, 224]             # CLIP standard input size
  normalize: true
  mean: [0.48145466, 0.4578275, 0.40821073]   # CLIP normalization
  std:  [0.26862954, 0.26130258, 0.27577711]

similarity:
  metric: "cosine"                    # IndexFlatIP on L2-normalised vectors
  top_k: 5
  threshold: 0.3                      # FashionCLIP cosine scores are generally lower than ResNet

paths:
  data_dir:           "./data"
  images_dir:         "./data/catalogue_images"
  manifest_csv:       "./data/manifest.csv"
  logs_dir:           "./logs"
  temp_uploads_dir:   "./data/uploads"

  # FashionCLIP index outputs (Vast.ai → local)
  faiss_indices_dir:  "backend/app/ml/fashionclip_indices"
  id_maps_dir:        "backend/app/ml/fashionclip_id_maps"

generation:
  batch_size: 64
  num_workers: 4
  pin_memory: true

mongodb:
  uri:        "mongodb+srv://ussamainayat:ussamainayat@dupefinder.u30xrsm.mongodb.net/"
  database:   "dupefinder"
  collection: "products"
