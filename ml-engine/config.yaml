# DupeFinder ML Engine Configuration (40% Milestone - Simplified)

model:
  architecture: "resnet50"  # Using ResNet50 for 40% milestone
  pretrained: true
  embedding_dimension: 2048  # ResNet50 feature vector size
  device: "auto"  # Will auto-detect: cuda > mps > cpu

preprocessing:
  target_size: [224, 224]  # Standard ImageNet input size
  normalize: true
  mean: [0.485, 0.456, 0.406]  # ImageNet normalization
  std: [0.229, 0.224, 0.225]
  remove_background: false  # Keep simple for 40%

similarity:
  metric: "cosine"  # Using cosine similarity (no FAISS for 40%)
  top_k: 5  # Return top 5 similar items
  threshold: 0.5  # Minimum similarity threshold (0-1)

paths:
  model_dir: "./models"
  data_dir: "./data"
  product_images_dir: "./data/product_images"
  embeddings_dir: "./data/embeddings"
  logs_dir: "./logs"
  temp_uploads_dir: "./data/uploads"

